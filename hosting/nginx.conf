worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    # The single most important pair of lines in this file. The previously deployed receiver omitted
    # them, nginx fell back to text/plain for .js, Chromium refused to execute the scripts under
    # nosniff, and every session died on the ~60s CastInitTimeout watchdog.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log /dev/stdout;

    server {
        listen 8080;
        root /usr/share/nginx/receiver;
        index index.html;

        # The page must never be cached: iterating means reloading it on the device.
        location = /index.html {
            add_header Cache-Control "no-store";
        }
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-store";
        }
        location /assets/ {
            expires 1h;
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
