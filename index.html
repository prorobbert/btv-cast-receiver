<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Budget Thuis TV — Cast receiver</title>

    <!--
      The CAF SDK comes from gstatic, never from this origin. Self-hosting it is what killed an earlier
      receiver: nginx served the copy as text/plain, Chromium refused to execute it with nosniff set,
      `cast` stayed undefined and every session died on the ~60s CastInitTimeout watchdog.
    -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="https://www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>

    <!--
      Our playback engine. The SDK would normally fetch a Shaka build of its own; castReceiverOptions
      .skipPlayersLoad stops that and this is the one it never sees. The version is pinned to the 4.15
      line on purpose: that is the line Google itself ships inside CAF (4.15.56 is the SDK default and
      it accepts >=4.15.56 <5.0.0), so it is the line actually exercised on Cast hardware. Moving to 5.x
      is a deliberate decision, not a floating range — hence no ^ or ~ in the URL.
    -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.15.60/dist/shaka-player.compiled.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <!-- Nothing is playing until a load request says otherwise, so the logo screen is the starting state. -->
  <body data-state="logo" data-ui="shown">
    <!--
      The picture. This element is ours: Shaka attaches to it and the SDK only watches it (we hand it
      over as castReceiverOptions.mediaElement, and the castMediaElement class is the documented marker
      for the same thing). Nothing draws chrome into it, so there is no shadow root to fight.
    -->
    <div id="stage">
      <video id="video" class="castMediaElement" playsinline></video>
      <!--
        Shaka renders text cues into this container rather than into the element's native track list,
        so subtitles obey our CSS instead of the platform's caption settings.
      -->
      <div id="captions"></div>
    </div>

    <div id="overlay" aria-hidden="true">
      <!-- Every state without a picture: launching, idle, stopped, errors. -->
      <section class="logoScreen">
        <img src="assets/logo.svg" alt="Budget Thuis" />
        <!-- Only ever set when a load or the engine itself failed; empty the rest of the time. -->
        <p class="logoScreen__error" id="error"></p>
        <!-- Which build is actually on the device. Stamped by deploy.sh; hidden when unstamped. -->
        <p class="logoScreen__build" id="build"></p>
      </section>

      <!-- The design's scrim: barely-there at the top, solid surface colour at the bottom. -->
      <div class="scrim"></div>

      <!-- Transport state, dead centre of the picture, exactly as the STB player draws it. -->
      <div class="control">
        <span class="control__glyph"></span>
      </div>

      <div class="hud">
        <div class="hud__info">
          <div class="hud__channel"><img id="artwork" alt="" /></div>
          <div class="hud__label">
            <p class="hud__title" id="title"></p>
            <p class="hud__subtitle" id="subtitle"></p>
          </div>
        </div>

        <div class="hud__seeker">
          <span class="hud__time" id="position">--:--</span>
          <div class="bar">
            <div class="bar__buffer" id="buffer"></div>
            <div class="bar__progress" id="progress"></div>
            <div class="bar__handle" id="handle"></div>
          </div>
          <span class="hud__time hud__time--end" id="duration">--:--</span>
        </div>
      </div>
    </div>

    <script src="version.js"></script>
    <script src="receiver.js"></script>
  </body>
</html>
