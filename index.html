<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Budget Thuis TV — Cast receiver</title>

    <link rel="stylesheet" href="styles.css" media="screen" />

    <!-- Loaded from gstatic, never self-hosted: self-hosted copies served as text/plain are what killed
         the previous receiver on the ~60s CastInitTimeout watchdog. -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="//www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>
  </head>

  <body>
    <!-- The SDK's built-in player and its UI. Styled with the documented CSS custom properties in
         styles.css; no custom DOM, so the platform's own controls integrate as designed. -->
    <cast-media-player></cast-media-player>

    <footer>
      <script src="version.js"></script>
      <script src="receiver.js"></script>
    </footer>
  </body>
</html>
